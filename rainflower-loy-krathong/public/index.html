#x{position:absolute;top:10px;right:10px;font:inherit;font-weight:500;width:32px;height:32px;background:var(--pink);color:#3b1d68;border:3px solid var(--line);cursor:pointer}

.k{position:absolute;left:0;width:0;will-change:left}
.kin{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:bob 2.4s steps(4) infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(4px)}}
.k img{image-rendering:pixelated;display:block;filter:drop-shadow(0 0 8px #ffd98acc)}
.nm{font-weight:400;font-size:11px;background:var(--pink-l);color:#4a2a7a;border:2px solid #6b46b0;padding:3px 12px;margin-top:2px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.wish{font-size:13.2px;line-height:1.25;background:#fffdf5;color:#4a2a7a;border:2px solid #6b46b0;padding:7px 14px;margin-bottom:8px;max-width:216px;text-align:center;word-break:break-word;position:relative}
.wish::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-4px;border:4px solid transparent;border-top:5px solid #6b46b0}
.mine .nm{background:#fff2a8}.mine .wish{border-color:#ff5fa8}
.status{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);white-space:nowrap;font-size:12px;background:#1a1040cc;color:#ffe6f4;padding:2px 8px;border:2px solid #b79cff;z-index:5}
.panel{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 24px);max-width:520px;max-height:calc(100dvh - 24px);overflow:auto;pointer-events:auto;padding:14px;background:#fff;color:#4a2a7a}
.panel h2{font-weight:500;text-align:center;padding:0 36px;font-family:'Chakra Petch',sans-serif;font-size:18px;margin:0 0 8px}
#types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.t{cursor:pointer;background:var(--vio-l);border:3px solid var(--line);padding:6px 2px 4px;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.t img{width:56px;image-rendering:pixelated}
.t[aria-pressed="true"]{background:var(--pink);box-shadow:3px 3px 0 var(--line);transform:translate(-1px,-1px);color:#3b1d68;font-weight:400}
label{display:block;font-size:13px;margin:8px 0 3px}
input,textarea{width:100%;font:inherit;font-size:15px;padding:8px;border:3px solid var(--line);background:#fffdfb;color:#3b1d68;border-radius:0}
input:focus,textarea:focus,.t:focus-visible,button:focus-visible{outline:3px solid #ffd54a;outline-offset:1px}
textarea{resize:none;height:72px}
.cnt{font-size:11px;text-align:right;opacity:.8}
#pick,#go{margin-top:12px;width:100%;font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:500;padding:10px;color:#fff;background:linear-gradient(var(--pink),#e87bb6);border:4px solid var(--line);box-shadow:4px 4px 0 var(--line);cursor:pointer;text-shadow:2px 2px 0 #b0508a}
#pick:active,#go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
#go:disabled{opacity:.6;cursor:wait}
.foot{color:#fff;text-shadow:1px 1px 0 #5b3a8c;text-align:center;font-size:12px;opacity:.75;margin:12px 0}
@media (max-width:520px){#types{gap:4px}.t img{width:44px}.t{font-size:10px}}
#ttl{position:fixed;left:50%;top:7%;transform:translateX(-50%);width:40vw;height:auto;pointer-events:none;z-index:25;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}

@media (max-aspect-ratio:1/1){#ttl{width:75vw;top:20%}}
#panel{border:0;box-shadow:none}
#panel .stage{background:#fff;border:0}
#panel .chosen{background:#fff;border:0}
#panel input,#panel textarea{background:#f2f0f7;border:0}
#panel #x,#panel #back{background:#f2f0f7;color:#4a2a7a;border:0;box-shadow:none}
#panel #pick,#panel #go{border:0;box-shadow:none;text-shadow:none}
#panel #pick:active,#panel #go:active{transform:translateY(2px);box-shadow:none}
#panel #dots i{border:0;background:#ddd6ee}
#panel #dots i.on{background:#FF469D}
#panel{height:min(440px,calc(100dvh - 24px))}
#panel:not(.hide){display:flex;flex-direction:column}
#s1:not(.hide),#s2:not(.hide){display:flex;flex-direction:column;flex:1}
#panel #pick,#panel #go{margin-top:auto}
#panel .cnt{margin-bottom:12px}#panel #dots{margin-bottom:12px}
#panel #big{width:min(calc(100% - 140px),260px);height:190px;object-fit:contain}
#panel .chosen img{width:72px;height:60px;object-fit:contain}
#scene{background-color:#1E294C;background-position:50% calc(50% - 15vh)}

function sprite(t){
  if(t===0)return BERRY;
  if(t===1)return TAOHUAY;
  if(t===2)return CHIP;
  if(t===3)return MILK;
  if(t===4)return MACARON;
  if(cache[t])return cache[t];
  const rows=[...head,...BODY[t],...BASE],c=document.createElement("canvas");
  c.width=16;c.height=rows.length;const x=c.getContext("2d");
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));
  return cache[t]=c.toDataURL();
}
const scene=document.getElementById("scene"),statusEl=document.getElementById("status");
const seen=new Set();let cnt=0;let sel=0,room=null,myPeer=null;

// carousel
const big=document.getElementById("big"),bn=document.getElementById("bn"),dots=document.getElementById("dots");
NAMES.forEach(()=>dots.append(document.createElement("i")));
function show(i){sel=(i+NAMES.length)%NAMES.length;big.src=sprite(sel);bn.textContent=NAMES[sel];[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===sel))}
function step(n){document.getElementById("s1").classList.toggle("hide",n!==1);document.getElementById("s2").classList.toggle("hide",n!==2);if(n===2){document.getElementById("sm").src=sprite(sel);document.getElementById("sn").textContent="กระทง"+NAMES[sel]}}
document.getElementById("prev").onclick=()=>show(sel-1);
document.getElementById("next").onclick=()=>show(sel+1);
document.getElementById("pick").onclick=()=>{step(2);document.getElementById("nm").focus()};
document.getElementById("back").onclick=()=>step(1);
document.addEventListener("keydown",e=>{if(document.getElementById("s1").classList.contains("hide")||document.getElementById("panel").classList.contains("hide"))return;if(e.key==="ArrowLeft")show(sel-1);if(e.key==="ArrowRight")show(sel+1)});
show(0);
const ws=document.getElementById("ws");ws.oninput=()=>document.getElementById("c").textContent=ws.value.length;

function spawn(d,mine,progress){
  if(!d||seen.has(d.id))return;seen.add(d.id);if(seen.size>3000){let n=0;for(const v of seen){seen.delete(v);if(++n>1000)break}}if(!d.amb)cap();
  const t=Math.max(0,Math.min(4,d.t|0));
  const lane=Math.random(); // 0 far .. 1 near
  const k=document.createElement("div");k.className="k"+(mine?" mine":"")+(d.amb?" amb":"");
  k.style.top="calc(60% + "+lane.toFixed(4)+" * max(0px, 35% - 80px))";
  k.style.zIndex=Math.round(lane*10);
  const inn=document.createElement("div");inn.className="kin";
  inn.style.animationDelay=(-Math.random()*2.4)+"s";
  if(d.w){const w=document.createElement("div");w.className="wish";w.textContent=String(d.w).slice(0,80);inn.append(w)}
  const im=document.createElement("img");im.src=sprite(t);im.alt="";im.style.width=(86.4+lane*50.4)+"px";
  const n=document.createElement("div");n.className="nm";n.textContent=String(d.n||"กระทงนิรนาม").slice(0,20);
  inn.append(im);if(!d.amb)inn.append(n);k.append(inn);scene.append(k);
  const dur=(mine?70:80+Math.random()*40)*1000;
  const kf=mine?[{left:"-12%",offset:0,easing:"ease-out"},{left:"6%",offset:2500/dur,easing:"linear"},{left:"112%",offset:1}]:[{left:"-12%"},{left:"112%"}];
  const a=k.animate(kf,{duration:dur,easing:"linear"});
  if(progress)a.currentTime=progress*dur;
  a.onfinish=()=>k.remove();
}

// ambient krathongs while idle
const POOL=[["น้องมะลิ","ขอให้ทุกคนมีความสุข",0],["ฟ้าใส","สอบผ่านทุกวิชา!",3],["กระทงมุ้งมิ้ง","ขอให้รักกันนานๆ",2],["ดาวพราว","สุขภาพแข็งแรงนะ",1],["ปุยเมฆ","ขอให้เงินเข้าทุกวัน",4]]
  ;
POOL.push(["มินท์","ขอให้โชคดีตลอดปี"],["บุ๋มบิ๋ม","ขอให้หายเหนื่อไวๆ"],["ฟ้าครึ้ม","ขอให้ได้เจอแต่เรื่องดีๆ"],["ซันนี่","ขอบคุณสำหรับทุกอย่างนะ"],["ลูกพีช","ขอให้ครอบครัวอบอุ่น"]);
let target=3+Math.floor(Math.random()*3),aid=0;
function more(first){
  if(scene.querySelectorAll(".k").length>=3)return;
  const s=POOL[Math.floor(Math.random()*POOL.length)];
  spawn({id:"a"+(aid++)+"-"+Date.now(),amb:1,t:Math.floor(Math.random()*5)},false,first===true?0.05+Math.random()*0.7:0);
  target=3+Math.floor(Math.random()*3);
}
for(let i=0;i<3;i++)more(true);
function batch(){const n=1+Math.floor(Math.random()*2);for(let i=0;i<n;i++)setTimeout(more,i*1500);setTimeout(batch,14000+Math.random()*10000)}
setTimeout(batch,6000);
setInterval(()=>{if(scene.querySelectorAll(".k").length<3)more()},2000);

// ---- backend: จำนวนกระทงรวม + เห็นกระทงของทุกคนแบบเรียลไทม์ (SSE) ----
const API=location.protocol==="http:"||location.protocol==="https:";
let total=0,online=0,connected=false,localCnt=0,toastT;
function renderStatus(){
  if(!API){statusEl.textContent="จำนวนกระทง "+localCnt;return}
  statusEl.textContent="จำนวนกระทง "+total.toLocaleString("th-TH")+(connected?(online?" · ออนไลน์ "+online:""):" · กำลังเชื่อมต่อ…");
}
function cap(){const ks=scene.querySelectorAll(".k:not(.amb)");for(let i=0;i<ks.length-60;i++)ks[i].remove()}
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";document.body.append(t)}
  t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3500)}
function conn(){
  if(!API||!window.EventSource)return;
  const es=new EventSource("/api/stream");
  const on=(name,fn)=>es.addEventListener(name,e=>{try{fn(JSON.parse(e.data))}catch(_){}});
  const mk=k=>({id:String(k.id).slice(0,40),t:k.t,n:k.n,w:k.w});
  es.onopen=()=>{connected=true;renderStatus()};
  es.onerror=()=>{connected=false;renderStatus()};
  on("hello",d=>{total=d.total|0;online=d.online|0;connected=true;renderStatus();
    (d.recent||[]).forEach(k=>spawn(mk(k),false,Math.min(0.9,(k.age||0)/100000)))});
  on("float",d=>{if(Number.isFinite(d.total))total=Math.max(total,d.total);renderStatus();spawn(mk(d),false,0)});
  on("online",d=>{online=d.online|0;renderStatus()});
}
renderStatus();conn();

const go=document.getElementById("go"),nm=document.getElementById("nm"),tog=document.getElementById("tog"),panel=document.getElementById("panel");
function setPanel(o){panel.classList.toggle("hide",!o);document.getElementById("bd").classList.toggle("hide",!o);if(o)step(1)}
tog.onclick=()=>setPanel(true);document.getElementById("x").onclick=()=>setPanel(false);document.getElementById("bd").onclick=()=>setPanel(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")setPanel(false)});
go.onclick=async()=>{
  const d={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),t:sel,
    n:nm.value.trim()||"กระทงนิรนาม",w:ws.value.trim()||"ขอให้ทุกคนมีความสุข"};
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  spawn(d,true,0);
  nm.value="";ws.value="";document.getElementById("c").textContent=0;
  setPanel(false);
  if(!API){localCnt++;renderStatus();return} // เปิดไฟล์ตรงๆ (ไม่มีเซิร์ฟเวอร์) = โหมดออฟไลน์
  try{
    const r=await fetch("/api/float",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
    if(r.status===429)toast("ลอยเร็วเกินไป รอสักครู่แล้วลองใหม่นะ");
    else if(!r.ok)throw new Error("http "+r.status);
    else{const j=await r.json();if(Number.isFinite(j.total)){total=Math.max(total,j.total);renderStatus()}}
  }catch(e){toast("ส่งกระทงให้คนอื่นเห็นไม่สำเร็จ ลองใหม่อีกครั้งนะ")}
};
// sky lanterns (pixel art, small gentle drift)
(function(){
  const P={r:"#d4423a",R:"#e8573a",o:"#f77a3c",O:"#ff9a45",y:"#ffc85a",Y:"#ffe58a",w:"#fff4c0"},
  R=["..rrrrrrrr..", ".rrrrrrrrrr.", ".rrRRRRRRrr.", ".rRRRRRRRRr.", ".RRRRRRRRRR.", ".RRooooooRR.", ".RooooooooR.", ".oooOOOOooo.", ".ooOOOOOOoo.", ".oOOOOOOOOo.", ".OOOyyyyOOO.", ".OOyyYYyyOO.", ".OyyYYYYyyO.", "..yyYwwYyy..", "..yYwwwwYy..", "....YwwY...."];
  const c=document.createElement("canvas");c.width=12;c.height=R.length;const x=c.getContext("2d");
  R.forEach((row,j)=>[...row].forEach((ch,i)=>{if(P[ch]){x.fillStyle=P[ch];x.fillRect(i,j,1,1)}}));
  const url=c.toDataURL(),box=document.getElementById("lan");
  [[3,28,36,5,7,5.4],[11,12,48,6,8,6.4],[76,34,48,6,8,5.8],[90,16,36,5,7,4.8]].forEach(([lx,ly,w,dx,dy,d],i)=>{
    const im=document.createElement("img");im.src=url;im.alt="";im.className="ln";
    im.style.cssText="left:"+lx+"%;top:"+ly+"%;width:"+w+"px;--dx:"+dx+"px;--dy:"+(-dy)+"px;animation-duration:"+d+"s;animation-delay:"+(-i*1.7)+"s";
    box.append(im)});
})();
// fireworks (top 40% of the screen, low-res canvas for a pixel look)
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=document.getElementById("fw"),cx=cv.getContext("2d"),S=4;
  let W,H;
  function fit(){W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight*0.4/S);cv.width=W;cv.height=H}
  fit();addEventListener("resize",fit);
  const COL=["#ff9ec7","#ffd6ea","#b79cff","#e6dcff","#ffe27a","#8fe3b5","#7fd4ff","#ffffff"];
  const rk=[],pt=[],rnd=(a,b)=>a+Math.random()*(b-a),pick=()=>COL[Math.floor(Math.random()*COL.length)];
  function launch(){rk.push({x:rnd(W*0.08,W*0.92),y:H,ty:rnd(H*0.3,H*0.55),vy:-rnd(1.6,2.1),tr:[]})}
  function burst(x,y){
    const n=Math.floor(rnd(28,52)),R=H*rnd(0.28,0.42),life=rnd(46,64),c1=pick(),c2=pick(),ring=Math.random()<0.4;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd(-.05,.05),sp=(ring?R:R*rnd(0.4,1))/life;
      pt.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:life*rnd(.85,1.1),c:i%3?c1:c2})}
  }
  let acc=0,next=0,last=performance.now();
  function step(){
    if(--next<=0&&rk.length<3){launch();next=Math.floor(rnd(25,60))}
    for(let i=rk.length-1;i>=0;i--){const r=rk[i];r.y+=r.vy;r.tr.push([r.x,r.y]);if(r.tr.length>5)r.tr.shift();if(r.y<=r.ty){burst(r.x,r.y);rk.splice(i,1)}}
    for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.t++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.006;if(p.t>p.life)pt.splice(i,1)}
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    rk.forEach(r=>r.tr.forEach((q,i)=>{cx.globalAlpha=(i+1)/6;cx.fillStyle="#fff0b0";cx.fillRect(q[0]|0,q[1]|0,2,2)}));
    pt.forEach(p=>{const k=p.t/p.life;cx.globalAlpha=k<.6?1:k<.85?.6:.3;cx.fillStyle=(k>.5&&(p.t&3)===0)?"#fff":p.c;cx.fillRect(p.x|0,p.y|0,2,2)});
    cx.globalAlpha=1;
  }
  function tick(now){acc+=Math.min(now-last,200);last=now;while(acc>=33){acc-=33;step()}draw();requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
})();
</script>
